[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-audit"
version = "0.1.0"
description = "An explainability trust auditor for any binary-classification model on tabular data — explains it, then adversarially tests whether that explanation can be trusted."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Samriddhi Guha" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "click>=8.1",
    "shap>=0.44",
    "groq>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
keras = ["tensorflow>=2.14"]
dev = ["pytest>=7.0"]

[project.scripts]
whitebox = "whitebox.cli:cli"

[tool.setuptools.packages.find]
include = ["whitebox*"]
